    <script>
        const ADMIN_PIN = "1234";
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3jCdQhXobfC7RMKPJIxgQXKzeXLyUMeuU8VOQQr25G_QRqaJ-pTCF3Cf0rb9S8PZObQ/exec";
        
        let allRecords = [];

        document.getElementById('btn-login').addEventListener('click', validatePin);
        document.getElementById('pin-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') validatePin(); });

        function validatePin() {
            const inputPin = document.getElementById('pin-input').value.trim();
            if (inputPin === ADMIN_PIN) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadRecords();
            } else {
                alert("PIN incorrecto. Intente nuevamente.");
            }
        }

        async function loadRecords() {
            const container = document.getElementById('results-container');
            container.innerHTML = '<div class="p-8 text-center text-slate-500 font-medium">Cargando registros desde Google Sheets...</div>';
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                allRecords = await response.json();
                renderRecords(allRecords);
            } catch (err) {
                container.innerHTML = '<div class="p-8 text-center text-red-500 font-medium">Error al conectar con la base de datos. Por favor reintente.</div>';
            }
        }

        document.getElementById('btn-refresh').addEventListener('click', loadRecords);

        document.getElementById('btn-search').addEventListener('click', function() {
            const query = document.getElementById('search-query').value.trim().toLowerCase();
            if (!query) {
                renderRecords(allRecords);
                return;
            }
            const filtered = allRecords.filter(r => 
                (r.nombres && r.nombres.toLowerCase().includes(query)) ||
                (r.apellidos && r.apellidos.toLowerCase().includes(query)) ||
                (r.identificacion && String(r.identificacion).toLowerCase().includes(query))
            );
            renderRecords(filtered);
        });

        function renderRecords(records) {
            const container = document.getElementById('results-container');
            if (!records || records.length === 0) {
                container.innerHTML = '<div class="p-8 text-center bg-white border border-slate-200 rounded-xl text-slate-500">No se encontraron registros coincidentes.</div>';
                return;
            }

            container.innerHTML = records.map((r, index) => {
                let perfilObj = {};
                try { perfilObj = typeof r.perfil === 'string' ? JSON.parse(r.perfil) : r.perfil; } catch(e){}

                return `
                    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-3 gap-2">
                            <div>
                                <h3 class="text-lg font-bold text-slate-900">${r.nombres || ''} ${r.apellidos || ''}</h3>
                                <p class="text-xs text-slate-500">ID: ${r.identificacion || 'N/A'} | Edad: ${r.edad || 'N/A'} | Correo: ${r.correo || 'N/A'}</p>
                            </div>
                            <button onclick="generatePDF(${index})" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-2">
                                📄 Descargar Reporte PDF
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-lg border border-slate-200 text-xs">
                            <div><span class="font-bold text-slate-700">Área Principal:</span> <br><span class="text-emerald-700 font-semibold">${r.top1 || 'N/A'}</span></div>
                            <div><span class="font-bold text-slate-700">Segunda Opción:</span> <br><span class="text-slate-800">${r.top2 || 'N/A'}</span></div>
                            <div><span class="font-bold text-slate-700">Tercera Opción:</span> <br><span class="text-slate-800">${r.top3 || 'N/A'}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

### Paso 1: Actualizar el código de Google Apps Script

Abre tu hoja en **Google Sheets > Extensiones > Apps Script** y reemplaza todo el código por este para permitir que el panel consulte la base de datos (función `doGet`):

```javascript
function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = JSON.parse(e.postData.contents);
  
  sheet.appendRow([
    new Date(),
    data.nombres,
    data.apellidos,
    data.identificacion,
    data.edad,
    data.correo,
    data.top1,
    data.top2,
    data.top3,
    JSON.stringify(data.perfil)
  ]);
  
  return ContentService.createTextOutput(JSON.stringify({ "result": "success" }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = sheet.getDataRange().getValues();
  var headers = data[0];
  var rows = data.slice(1);
  
  var result = rows.map(function(row) {
    var obj = {};
    headers.forEach(function(header, index) {
      obj[header] = row[index];
    });
    return obj;
  });
  
  return ContentService.createTextOutput(JSON.stringify(result))
    .setMimeType(ContentService.MimeType.JSON);
}
