            </div>
            <div>

            </div>
            <button type="button" onclick="validateLogin()" class="w-full py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition shadow-sm">Ingresar al Panel</button>
        </div>

        <!-- PANEL DE BÚSQUEDA Y REPORTES -->
        <div id="admin-panel" class="hidden space-y-6">
            <div class="card-box p-6 md:p-8 space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">Consulta de Evaluados</h2>
                        <p class="text-sm text-slate-500">Busque por identificación o nombres para descargar el informe cualitativo individual en PDF.</p>
                    </div>
                    <button onclick="loadRecords()" type="button" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition flex items-center gap-1">
                        🔄 Sincronizar Datos
                    </button>
                </div>

                    <input type="text" id="search-input" placeholder="Ingrese Identificación (Cédula) o Nombres..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-black outline-none text-sm">
                    <button type="button" onclick="searchRecords()" class="px-6 py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition text-sm whitespace-nowrap">
                        Buscar Registro
                    </button>
                </div>

                <div id="status-msg" class="text-xs text-slate-500 hidden font-medium">Cargando registros...</div>

                <div id="results-container" class="space-y-4 hidden border-t border-slate-100 pt-4">

                    <div id="results-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

        function validateLogin() {
            const pinVal = document.getElementById('pin-input').value.trim();
            if (pinVal === ADMIN_PIN || pinVal === "1234") {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadRecords();
            } else {
                alert("PIN incorrecto. Ingrese 1234");
            }
        }

        document.getElementById('pin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validateLogin();
        });

        async function loadRecords() {
            const status = document.getElementById('status-msg');
            status.classList.remove('hidden');
            status.className = "text-xs text-slate-500 font-medium";
            status.innerText = "Conectando con Google Sheets...";

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                if (!response.ok) throw new Error("Error en la respuesta del servidor");
                
                dbRecords = await response.json();
                status.className = "text-xs text-emerald-600 font-medium";
                status.innerText = `Sincronización exitosa: ${dbRecords.length} registro(s) disponible(s).`;
            } catch (e) {
                status.className = "text-xs text-red-500 font-medium";
                status.innerText = "Error al conectar con Google Sheets. Verifique el despliegue.";
            }
        }

        function searchRecords() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsList = document.getElementById('results-list');
            const container = document.getElementById('results-container');
            resultsList.innerHTML = '';

            if (!query) {
                alert("Por favor ingrese un término de búsqueda.");
                return;
            }

            const matches = dbRecords.filter(r => {
                const nombres = (r.nombres || r.Nombres || '').toLowerCase();
                const apellidos = (r.apellidos || r.Apellidos || '').toLowerCase();
                const fullName = `${nombres} ${apellidos}`;
                const id = String(r.identificacion || r.Identificacion || '').toLowerCase();
                
                return fullName.includes(query) || id.includes(query);
            });

            if (matches.length === 0) {
                resultsList.innerHTML = '<p class="text-sm text-slate-500 py-4 text-center">No se encontraron evaluaciones registradas con ese criterio.</p>';
            } else {
                matches.forEach((r) => {
                    const idx = dbRecords.indexOf(r);
                    const nombres = r.nombres || r.Nombres || '';
                    const apellidos = r.apellidos || r.Apellidos || '';
                    const id = r.identificacion || r.Identificacion || 'N/A';
                    const edad = r.edad || r.Edad || 'N/A';
                    const correo = r.correo || r.Correo || 'N/A';
                    const top1 = r.top1 || r['Top 1 Area'] || 'N/A';

                    resultsList.innerHTML += `
                        <div class="p-4 border border-slate-200 rounded-xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h4 class="font-bold text-slate-900">${nombres} ${apellidos}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">ID: ${id} | Edad: ${edad} | Correo: ${correo}</p>
                                <p class="text-xs font-semibold text-emerald-700 mt-1">Sugerencia Principal: ${top1}</p>
                            </div>
                            <button onclick="generatePDFForRecord(${idx})" class="px-4 py-2 bg-black hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition whitespace-nowrap">
                                📄 Descargar PDF
                            </button>
                        </div>
                    `;
                });
            }
            container.classList.remove('hidden');
        }

        function generateAxisNarrative(perfil) {

            const per = perfil["Perseverancia"] || 50;
            const vit = perfil["Vitalidad"] || 50;
            const avgProd = (rec + per + vit) / 3;

            let prodMejora = "";

            if (avgProd >= 70) {
                prodFortaleza = "Excelente capacidad ejecutora y dinamismo operativo. Resuelve contingencias con agilidad y sostiene la disciplina en entregables de largo alcance.";
                prodMejora = "Evitar la sobrecarga autoinfligida de trabajo y asegurar la estandarización documental de sus métodos innovadores.";
            } else if (avgProd >= 50) {
                prodFortaleza = "Desempeño constante y disciplinado en rutinas operativas habituales, utilizando recursos de forma eficiente y ordenada.";
                prodMejora = "Estimular la iniciativa propia ante bloqueos imprevistos y fortalecer la tenacidad en proyectos de largo aliento.";
            } else {
                prodFortaleza = "Orientación a tareas metodológicas de ritmo pausado que requieren concentración y seguimiento paso a paso.";
                prodMejora = "Subdividir grandes metas en objetivos semanales y contar con supervisión periódica para mantener el ritmo operativo.";
            }
