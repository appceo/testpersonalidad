        async function loadRecords() {
            const status = document.getElementById('status-msg');
            status.classList.remove('hidden');
            status.className = "text-xs text-slate-500 font-medium";
            status.innerText = "Conectando con Google Sheets...";

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                if (!response.ok) throw new Error("Error en la respuesta del servidor");
                
                dbRecords = await response.json();
                status.className = "text-xs text-emerald-600 font-medium";
                status.innerText = `Sincronización exitosa: ${dbRecords.length} registro(s) disponible(s).`;
            } catch (e) {
                status.className = "text-xs text-red-500 font-medium";
                status.innerText = "Error al conectar con Google Sheets. Verifique el despliegue.";
            }
        }

        function searchRecords() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsList = document.getElementById('results-list');
            const container = document.getElementById('results-container');
            resultsList.innerHTML = '';

            if (!query) {
                alert("Por favor ingrese un término de búsqueda.");
                return;
            }

            const matches = dbRecords.filter(r => {
                const nombres = (r.nombres || r.Nombres || '').toLowerCase();
                const apellidos = (r.apellidos || r.Apellidos || '').toLowerCase();
                const fullName = `${nombres} ${apellidos}`;
                const id = String(r.identificacion || r.Identificacion || '').toLowerCase();
                
                return fullName.includes(query) || id.includes(query);
            });

            if (matches.length === 0) {
                resultsList.innerHTML = '<p class="text-sm text-slate-500 py-4 text-center">No se encontraron evaluaciones registradas con ese criterio.</p>';
            } else {
                matches.forEach((r) => {
                    const idx = dbRecords.indexOf(r);
                    const nombres = r.nombres || r.Nombres || '';
                    const apellidos = r.apellidos || r.Apellidos || '';
                    const id = r.identificacion || r.Identificacion || 'N/A';
                    const edad = r.edad || r.Edad || 'N/A';
                    const correo = r.correo || r.Correo || 'N/A';
                    const top1 = r.top1 || r['Top 1 Area'] || 'N/A';

                    resultsList.innerHTML += `
                        <div class="p-4 border border-slate-200 rounded-xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h4 class="font-bold text-slate-900">${nombres} ${apellidos}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">ID: ${id} | Edad: ${edad} | Correo: ${correo}</p>
                                <p class="text-xs font-semibold text-emerald-700 mt-1">Sugerencia Principal: ${top1}</p>
                            </div>
                            <button onclick="generatePDFForRecord(${idx})" class="px-4 py-2 bg-black hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition whitespace-nowrap">
                                📄 Descargar PDF
                            </button>
                        </div>
                    `;
                });
            }
            container.classList.remove('hidden');
        }

        // LÓGICA DE GENERACIÓN DE INFORME DESCRIPTIVO POR EJES
        function generateAxisNarrative(perfil) {

            const per = perfil["Perseverancia"] || 50;
            const vit = perfil["Vitalidad"] || 50;
            const avgProd = (rec + per + vit) / 3;

            let prodFortaleza = "";
            let prodMejora = "";

            if (avgProd >= 70) {
                prodFortaleza = "Excelente capacidad ejecutora y dinamismo operativo. Resuelve contingencias con agilidad y sostiene la disciplina en entregables de largo alcance.";
                prodMejora = "Evitar la sobrecarga autoinfligida de trabajo y asegurar la estandarización documental de sus métodos innovadores.";
            } else if (avgProd >= 50) {
                prodFortaleza = "Desempeño constante y disciplinado en rutinas operativas habituales, utilizando recursos de forma eficiente y ordenada.";
                prodMejora = "Estimular la iniciativa propia ante bloqueos imprevistos y fortalecer la tenacidad en proyectos de largo aliento.";
            } else {
                prodFortaleza = "Orientación a tareas metodológicas de ritmo pausado que requieren concentración y seguimiento paso a paso.";
                prodMejora = "Subdividir grandes metas en objetivos semanales y contar con supervisión periódica para mantener el ritmo operativo.";
            }

            // Eje 2: Manejo Emocional (Adaptabilidad, Tolerancia)
            const ada = perfil["Adaptabilidad"] || 50;
            const tol = perfil["Tolerancia"] || 50;
            const avgEmo = (ada + tol) / 2;

            let emoFortaleza = "";
            let emoMejora = "";

            if (avgEmo >= 70) {
                emoFortaleza = "Avanzado autocontrol y templanza. Conserva la serenidad bajo presión y actúa como mediador pacificador en momentos de tensión o cambio.";
                emoMejora = "Asegurar que la alta tolerancia no postergue decisiones correctivas firmes cuando la disciplina organizativa lo exija.";
            } else if (avgEmo >= 50) {
                emoFortaleza = "Adecuada estabilidad emocional frente a imprevistos normales. Escucha activamente y gestiona las diferencias con madurez.";
                emoMejora = "Comunicar con antelación las modificaciones de planes para mitigar la resistencia natural al cambio voluntario.";
            } else {
                emoFortaleza = "Firmeza en convicciones, apego riguroso a estándares y alto sentido del deber dentro de estructuras estables.";
                emoMejora = "Desarrollar mayor flexibilidad comunicativa y resiliencia emocional cuando los escenarios cambien intempestivamente.";
            }

            // Eje 3: Relaciones Interpersonales (Destreza Social, Sensibilidad Social, Persuasión)
            const des = perfil["Destreza Social"] || 50;
            const sen = perfil["Sensibilidad Social"] || 50;
            const perS = perfil["Persuasión"] || 50;
            const avgRel = (des + sen + perS) / 3;

            let relFortaleza = "";
            let relMejora = "";

            if (avgRel >= 70) {
                relFortaleza = "Liderazgo carismático, empatía activa e influencia natural. Conecta de forma inmediata, motiva a grupos y detecta necesidades humanas.";
                emoMejora = "Establecer límites sanos para evitar el agotamiento por sobreinvolucramiento en problemas ajenos.";
            } else if (avgRel >= 50) {
                relFortaleza = "Buenas relaciones interpersonales sostenidas en el respeto, la escucha y el apoyo oportuno dentro de equipos de trabajo.";
                relMejora = "Ampliar progresivamente su círculo de influencia y asumir roles de vocería con mayor soltura.";
            } else {
                relFortaleza = "Estilo relacional prudente y respetuoso, enfocado en el cumplimiento de tareas sin generar fricciones en el entorno.";
                relMejora = "Fomentar la participación activa en dinámicas comunitarias de integración y trabajo colaborativo.";
            }

            return {
                productividad: { fortaleza: prodFortaleza, mejora: prodMejora },
                emocional: { fortaleza: emoFortaleza, mejora: emoMejora },
                relaciones: { fortaleza: relFortaleza, mejora: relMejora }
            };
        }

        function generatePDFForRecord(index) {
            const record = dbRecords[index];
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            function cleanAreaName(rawName) {
                if (!rawName) return "";
                return rawName.replace(/\s*\(\d+\%\)/g, "").trim();
            }

            let perfil = {};
            try {
                const rawPerfil = record.perfil || record['Perfil Resumen'];
                perfil = typeof rawPerfil === 'string' ? JSON.parse(rawPerfil) : rawPerfil;
            } catch (e) {
                perfil = {};
            }

            const nombres = record.nombres || record.Nombres || '';
            const apellidos = record.apellidos || record.Apellidos || '';
            const id = record.identificacion || record.Identificacion || 'N/A';
            const edad = record.edad || record.Edad || 'N/A';
            const correo = record.correo || record.Correo || 'N/A';

            const rawTop1 = record.top1 || record['Top 1 Area'] || 'N/A';
            const rawTop2 = record.top2 || record['Top 2 Area'] || 'N/A';
            const rawTop3 = record.top3 || record['Top 3 Area'] || 'N/A';

            const cleanTop1 = cleanAreaName(rawTop1);
            const cleanTop2 = cleanAreaName(rawTop2);
            const cleanTop3 = cleanAreaName(rawTop3);

            // Encabezado Corporativo
            doc.setFillColor(0, 0, 0);
            doc.rect(0, 0, 210, 20, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(13);
            doc.setFont("helvetica", "bold");
            doc.text("IGLECO - PERFILAMIENTO PSICOMÉTRICO Y MINISTERIAL", 14, 13);

            // Datos Personales
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(11);
            doc.text("INFORMACIÓN DEL EVALUADO", 14, 28);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`Nombre Completo: ${nombres} ${apellidos}`, 14, 34);
            doc.text(`Identificación: ${id}`, 14, 40);
            doc.text(`Edad: ${edad} años`, 14, 46);
            doc.text(`Correo Electrónico: ${correo}`, 14, 52);

            // ÁREAS SUGERIDAS (Ancho corregido para evitar saltos de línea de la primera columna)
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("ÁREAS DE SERVICIO SUGERIDAS Y DEFINICIÓN TÉCNICA", 14, 62);

            const areasBody = [
                ['Área Principal (Top 1)', rawTop1, DEFINICIONES_AREAS[cleanTop1] || "Acompañamiento e integración en el servicio comunitario."],
                ['Área Secundaria (Top 2)', rawTop2, DEFINICIONES_AREAS[cleanTop2] || "Soporte colaborativo en procesos operativos y de acompañamiento."],
                ['Área Alternativa (Top 3)', rawTop3, DEFINICIONES_AREAS[cleanTop3] || "Opción complementaria para diversificar el servicio según las necesidades."]
            ];

            doc.autoTable({
                startY: 65,
                head: [['Prioridad', 'Área Recomendada', 'Propósito y Alcance del Área']],
                body: areasBody,
                theme: 'striped',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 46 }, 1: { cellWidth: 38 }, 2: { cellWidth: 98 } }
            });

            // DIAGNÓSTICO CUALITATIVO PROFUNDO POR CATEGORÍA
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("DIAGNÓSTICO CUALITATIVO PROFUNDO POR CATEGORÍA", 14, doc.lastAutoTable.finalY + 10);

            const sortedTraits = Object.keys(perfil).sort((a, b) => perfil[b] - perfil[a]);

            const traitRows = sortedTraits.map(trait => {
                const score = perfil[trait];
                let nivelKey = "medio";
                let badge = "DESARROLLADO";
                
                if (score >= 75) {
                    nivelKey = "alto";
                    badge = "SOBRESALIENTE";
                } else if (score < 50) {
                    nivelKey = "bajo";
                    badge = "EN DESARROLLO";
                }

                const obsObj = OBSERVACIONES[trait] || {
                    alto: "Desempeño sobresaliente en la categoría.",
                    medio: "Desempeño adecuado y funcional.",
                    bajo: "Área con oportunidad de crecimiento."
                };

                return [trait, `${score}%\n[ ${badge} ]`, obsObj[nivelKey]];
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 14,
                head: [['Rasgo Evaluado', 'Puntaje / Nivel', 'Perfilamiento Cualitativo Profundo / Observación']],
                body: traitRows.length > 0 ? traitRows : [['N/A', 'N/A', 'Sin datos disponibles']],
                theme: 'grid',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 36 }, 1: { cellWidth: 38 }, 2: { cellWidth: 106 } }
            });

            // INFORME DESCRIPTIVO ESTRUCTURADO POR EJES (NUEVO BLOQUE REQUERIDO)
            const narrative = generateAxisNarrative(perfil);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("INFORME DESCRIPTIVO: EVALUACIÓN POR EJES CONDUCTUALES", 14, doc.lastAutoTable.finalY + 10);

            const axisRows = [
                [
                    'EJECUCIÓN DE TAREAS Y PRODUCTIVIDAD',
                    `• Fortaleza: ${narrative.productividad.fortaleza}\n• Oportunidad de Crecimiento: ${narrative.productividad.mejora}`
                ],
                [
                    'MANEJO EMOCIONAL',
                    `• Fortaleza: ${narrative.emocional.fortaleza}\n• Oportunidad de Crecimiento: ${narrative.emocional.mejora}`
                ],
                [
                    'RELACIONES INTERPERSONALES',
                    `• Fortaleza: ${narrative.relaciones.fortaleza}\n• Oportunidad de Crecimiento: ${narrative.relaciones.mejora}`
                ]
            ];

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 14,
                head: [['Eje Conductual Evaluado', 'Diagnóstico Qualitativo (Fortalezas vs Oportunidades)']],
                body: axisRows,
                theme: 'striped',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 50 }, 1: { cellWidth: 130 } }
            });

            doc.save(`Reporte_IGLECO_Cualitativo_${id}.pdf`);
        }
    </script>
