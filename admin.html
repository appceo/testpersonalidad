<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | IGLECO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF para Reportes PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        .card-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- ENCABEZADO CORPORATIVO IGLECO -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="text-2xl font-black tracking-widest text-black flex items-center">
                    IGLE<span class="font-extrabold text-slate-800">CO</span>
                </div>
                <div class="h-6 w-px bg-slate-300"></div>
                <span class="text-xs font-bold tracking-wider text-slate-500 uppercase">Panel Administrativo</span>
            </div>
            <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-mono border border-slate-200">Acceso Restringido</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto my-10 px-4">
        
        <!-- PANTALLA DE ACCESO POR PIN -->
        <div id="login-box" class="card-box p-8 max-w-md mx-auto text-center space-y-6">
            <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mx-auto text-xl">🔒</div>
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Acceso Requerido</h2>
                <p class="text-sm text-slate-500 mt-1">Ingrese el PIN de seguridad para acceder al panel.</p>
            </div>
            <div>
                <input type="password" id="pin-input" placeholder="••••" maxlength="8" class="w-full p-3 border border-slate-300 rounded-lg text-center text-2xl tracking-widest outline-none focus:ring-2 focus:ring-black">
            </div>
            <button type="button" id="btn-login" class="w-full py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition shadow-sm">Ingresar al Panel</button>
        </div>

        <!-- PANEL DE BÚSQUEDA Y REPORTES -->
        <div id="admin-panel" class="hidden space-y-6">
            <div class="card-box p-6 md:p-8 space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">Consulta de Evaluados</h2>
                        <p class="text-sm text-slate-500">Busque por identificación o nombres para descargar el informe individual en PDF.</p>
                    </div>
                    <button id="btn-fetch" type="button" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition flex items-center gap-1">
                        🔄 Sincronizar Datos
                    </button>
                </div>

                <!-- CAMPO DE BÚSQUEDA -->
                <div class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="search-input" placeholder="Ingrese Identificación (Cédula) o Nombres..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-black outline-none text-sm">
                    <button type="button" id="btn-search" class="px-6 py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition text-sm whitespace-nowrap">
                        Buscar Registro
                    </button>
                </div>

                <div id="status-msg" class="text-xs text-slate-500 hidden font-medium">Cargando registros...</div>

                <!-- RESULTADOS DE BÚSQUEDA -->
                <div id="results-container" class="space-y-4 hidden border-t border-slate-100 pt-4">
                    <h3 class="font-bold text-slate-900 text-xs uppercase tracking-wider text-slate-500">Resultados Encontrados</h3>
                    <div id="results-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const ADMIN_PIN = "1234";
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIuqJ7f3v20mmdThj1Ia8A6el4RrJ_KM-Le8CbD826l_1s2x2yooDNDMrya98K0v_kqA/exec";
        let dbRecords = [];

        document.getElementById('btn-login').addEventListener('click', function() {
            const pin = document.getElementById('pin-input').value.trim();
            if (pin === ADMIN_PIN) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadRecords();
            } else {
                alert("PIN incorrecto.");
            }
        });

        document.getElementById('pin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('btn-login').click();
            }
        });

        document.getElementById('btn-fetch').addEventListener('click', loadRecords);
        document.getElementById('btn-search').addEventListener('click', searchRecords);
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchRecords();
            }
        });

        async function loadRecords() {
            const status = document.getElementById('status-msg');
            status.classList.remove('hidden');
            status.className = "text-xs text-slate-500 font-medium";
            status.innerText = "Conectando con Google Sheets...";

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                if (!response.ok) throw new Error("Error en la respuesta del servidor");
                
                dbRecords = await response.json();
                status.className = "text-xs text-emerald-600 font-medium";
                status.innerText = `Sincronización exitosa: ${dbRecords.length} registro(s) disponible(s).`;
            } catch (e) {
                status.className = "text-xs text-red-500 font-medium";
                status.innerText = "Error al conectar con Google Sheets. Asegúrese de haber desplegado una 'Nueva Versión' en Apps Script.";
            }
        }

        function searchRecords() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsList = document.getElementById('results-list');
            const container = document.getElementById('results-container');
            resultsList.innerHTML = '';

            if (!query) {
                alert("Por favor ingrese un término de búsqueda.");
                return;
            }

            const matches = dbRecords.filter(r => {
                const nombres = (r.nombres || r.Nombres || '').toLowerCase();
                const apellidos = (r.apellidos || r.Apellidos || '').toLowerCase();
                const fullName = `${nombres} ${apellidos}`;
                const id = String(r.identificacion || r.Identificacion || '').toLowerCase();
                
                return fullName.includes(query) || id.includes(query);
            });

            if (matches.length === 0) {
                resultsList.innerHTML = '<p class="text-sm text-slate-500 py-4 text-center">No se encontraron evaluaciones registradas con ese criterio.</p>';
            } else {
                matches.forEach((r, idx) => {
                    const nombres = r.nombres || r.Nombres || '';
                    const apellidos = r.apellidos || r.Apellidos || '';
                    const id = r.identificacion || r.Identificacion || 'N/A';
                    const edad = r.edad || r.Edad || 'N/A';
                    const correo = r.correo || r.Correo || 'N/A';
                    const top1 = r.top1 || r['Top 1 Area'] || 'N/A';

                    resultsList.innerHTML += `
                        <div class="p-4 border border-slate-200 rounded-xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h4 class="font-bold text-slate-900">${nombres} ${apellidos}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">ID: ${id} | Edad: ${edad} | Correo: ${correo}</p>
                                <p class="text-xs font-semibold text-emerald-700 mt-1">Sugerencia: Top 1: ${top1}</p>
                            </div>
                            <button onclick="generatePDFForRecord(${dbRecords.indexOf(r)})" class="px-4 py-2 bg-black hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition whitespace-nowrap">
                                📄 Descargar PDF
                            </button>
                        </div>
                    `;
                });
            }
            container.classList.remove('hidden');
        }

        function generatePDFForRecord(index) {
            const record = dbRecords[index];
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let perfil = {};
            try {
                const rawPerfil = record.perfil || record['Perfil Resumen'];
                perfil = typeof rawPerfil === 'string' ? JSON.parse(rawPerfil) : rawPerfil;
            } catch (e) {
                perfil = {};
            }

            const nombres = record.nombres || record.Nombres || '';
            const apellidos = record.apellidos || record.Apellidos || '';
            const id = record.identificacion || record.Identificacion || 'N/A';
            const edad = record.edad || record.Edad || 'N/A';
            const correo = record.correo || record.Correo || 'N/A';
            const top1 = record.top1 || record['Top 1 Area'] || 'N/A';
            const top2 = record.top2 || record['Top 2 Area'] || 'N/A';
            const top3 = record.top3 || record['Top 3 Area'] || 'N/A';

            // Encabezado Corporativo
            doc.setFillColor(0, 0, 0);
            doc.rect(0, 0, 210, 20, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("IGLECO - REPORTE PSICOMÉTRICO MINISTERIAL", 14, 13);

            // Datos Personales
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(11);
            doc.text("INFORMACIÓN DEL EVALUADO", 14, 30);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`Nombre Completo: ${nombres} ${apellidos}`, 14, 37);
            doc.text(`Identificación: ${id}`, 14, 43);
            doc.text(`Edad: ${edad}`, 14, 49);
            doc.text(`Correo Electrónico: ${correo}`, 14, 55);

            // Áreas de Servicio Recomendadas
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("ÁREAS DE SERVICIO SUGERIDAS", 14, 66);

            doc.autoTable({
                startY: 70,
                head: [['Prioridad', 'Área Recomendada']],
                body: [
                    ['Área Principal (Top 1)', top1],
                    ['Área Secundaria (Top 2)', top2],
                    ['Área Alternativa (Top 3)', top3]
                ],
                theme: 'striped',
                headStyles: { fillColor: [0, 0, 0] }
            });

            // Perfil de Rasgos
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("DESGLOSE DE RASGOS DE PERSONALIDAD", 14, doc.lastAutoTable.finalY + 12);

            const traitRows = Object.keys(perfil).map(trait => {
                const score = perfil[trait];
                let desc = "Puntaje Promedio.";
                if (score >= 75) desc = "Sobresaliente. Muestra alta naturalidad y dominio espontáneo.";
                else if (score >= 50) desc = "Desarrollado. Nivel adecuado y funcional.";
                else desc = "En desarrollo. Oportunidad de fortalecimiento y apoyo.";
                
                return [trait, `${score}%`, desc];
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 16,
                head: [['Rasgo Evaluado', 'Puntaje', 'Interpretación / Comentarios']],
                body: traitRows.length > 0 ? traitRows : [['N/A', 'N/A', 'Sin datos de perfil']],
                theme: 'grid',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 40 }, 1: { cellWidth: 25 }, 2: { cellWidth: 115 } }
            });

            doc.save(`Reporte_IGLECO_${id}.pdf`);
        }
    </script>
</body>
</html>
