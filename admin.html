<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | IGLECO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF para Reportes PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        .card-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- ENCABEZADO CORPORATIVO IGLECO -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="text-2xl font-black tracking-widest text-black flex items-center">
                    IGLE<span class="font-extrabold text-slate-800">CO</span>
                </div>
                <div class="h-6 w-px bg-slate-300"></div>
                <span class="text-xs font-bold tracking-wider text-slate-500 uppercase">Panel Administrativo</span>
            </div>
            <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-mono border border-slate-200">Acceso Restringido</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto my-10 px-4">
        
        <!-- PANTALLA DE ACCESO POR PIN -->
        <div id="login-box" class="card-box p-8 max-w-md mx-auto text-center space-y-6">
            <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mx-auto text-xl">🔒</div>
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Acceso Requerido</h2>
                <p class="text-sm text-slate-500 mt-1">Ingrese el PIN de seguridad para acceder al panel.</p>
            </div>
            <div>
                <input type="password" id="pin-input" placeholder="••••" maxlength="8" class="w-full p-3 border border-slate-300 rounded-lg text-center text-2xl tracking-widest outline-none focus:ring-2 focus:ring-black">
            </div>
            <button type="button" id="btn-login" class="w-full py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition shadow-sm">Ingresar al Panel</button>
        </div>

        <!-- PANEL DE BÚSQUEDA Y REPORTES -->
        <div id="admin-panel" class="hidden space-y-6">
            <div class="card-box p-6 md:p-8 space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">Consulta de Evaluados</h2>
                        <p class="text-sm text-slate-500">Busque por identificación o nombres para descargar el informe cualitativo individual en PDF.</p>
                    </div>
                    <button id="btn-fetch" type="button" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition flex items-center gap-1">
                        🔄 Sincronizar Datos
                    </button>
                </div>

                <!-- CAMPO DE BÚSQUEDA -->
                <div class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="search-input" placeholder="Ingrese Identificación (Cédula) o Nombres..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-black outline-none text-sm">
                    <button type="button" id="btn-search" class="px-6 py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition text-sm whitespace-nowrap">
                        Buscar Registro
                    </button>
                </div>

                <div id="status-msg" class="text-xs text-slate-500 hidden font-medium">Cargando registros...</div>

                <!-- RESULTADOS DE BÚSQUEDA -->
                <div id="results-container" class="space-y-4 hidden border-t border-slate-100 pt-4">
                    <h3 class="font-bold text-slate-900 text-xs uppercase tracking-wider text-slate-500">Resultados Encontrados</h3>
                    <div id="results-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const ADMIN_PIN = "1234";
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3jCdQhXobfC7RMKPJIxgQXKzeXLyUMeuU8VOQQr25G_QRqaJ-pTCF3Cf0rb9S8PZObQ/exec";
        let dbRecords = [];

        // DEFINICIONES TÉCNICAS OFICIALES DE LAS ÁREAS DE IGLECO
        const DEFINICIONES_AREAS = {
            "Acompañamiento": "Cuidado pastoral y soporte emocional primario a personas o familias en situaciones de vulnerabilidad, duelo o transición personal. Requiere empatía activa, capacidad de escucha libre de juicios y confidencialidad.",
            "Adoración": "Dirección y ejecución del ministerio de música e instrumentación en las reuniones. Busca facilitar un entorno de conexión espiritual comunitaria a través de la excelencia musical y una actitud de servicio constante.",
            "Artístico": "Expresión creativa mediante disciplinas como las artes escénicas, danza, teatro y composición visual. Diseñado para transmitir mensajes bíblicos y conceptuales de forma estética e innovadora.",
            "Producción": "Gestión técnica y operativa del soporte logístico de audio, iluminación, transmisión en vivo y sistemas de presentación visual durante los servicios y eventos.",
            "Ayudas Administrativas": "Soporte organizativo en la gestión de archivos, bases de datos, logística de suministros, llamadas de seguimiento y sistematización de procesos internos de la iglesia.",
            "Ayudas Profesionales": "Orientación especializada en áreas técnicas (asesoría jurídica, contable, psicológica, médica o de arquitectura) brindada a miembros de la comunidad o a la estructura ministerial según sus necesidades.",
            "Conexión": "Acogida y primer contacto con personas que visitan la iglesia por primera vez. Se encarga de la integración fluida de los asistentes a los grupos de amistad o ruta de consolidación.",
            "Contact Center": "Atención remota (telefónica, chat o correo) para responder inquietudes, brindar información sobre horarios/eventos, registrar solicitudes de oración y mantener una línea abierta de comunicación con la membresía.",
            "Decoración": "Ambientación y diseño espacial de los diferentes entornos del templo o eventos especiales, asegurando una estética coherente con la identidad visual corporativa y el propósito del evento.",
            "Discipulado": "Formación, mentoría y guía en el crecimiento espiritual mediante el estudio de la Biblia, el modelamiento de vida cristiana y la facilitación de pequeños grupos de enseñanza.",
            "CFV - Kids": "Formación espiritual y pedagógica dirigida a la infancia temprana y escolar. Adapta contenidos bíblicos mediante metodologías didácticas, dinámicas y un entorno de cuidado seguro.",
            "Evangelismo": "Proyección hacia la comunidad externa mediante brigadas, actividades de alcance social e iniciativas interactivas orientadas a presentar el mensaje del evangelio a personas no creyentes.",
            "Hospitalidad": "Preparación y gestión de alimentos, bebidas, atención a invitados especiales y preparación de espacios de convivencia para generar un ambiente cálido y acogedor en la iglesia.",
            "Maquillaje": "Caracterización y arreglo estético del personal de producción visual, cámaras, obras teatrales o contenido audiovisual institucional, respetando los estándares de iluminación y pantalla.",
            "Monitores Escuelas": "Apoyo logístico, control de asistencia, asistencia a docentes y dinamización en las aulas durante las academias, talleres o programas formales de formación de la iglesia.",
            "Oración": "Cobertura de intercesión continua por las peticiones de la comunidad, eventos institucionales, liderazgo y necesidades pastorales particulares a través de turnos y vigilias de oración.",
            "PowerKids": "Actividades de alto impacto, animación y dinamismo enfocadas en preadolescentes y niños mayores, combinando recreación activa, liderazgo juvenil y enseñanza bíblica práctica.",
            "Seguridad": "Prevención, protocolo de respuesta ante emergencias, control de accesos y resguardo del orden físico e integridad de las personas en las instalaciones de la iglesia.",
            "Servidores": "Logística interna y protocolo durante los servicios: acomodación de personas, apoyo en la recolección de ofrendas, mantenimiento del orden en el auditorio y guía al asistente.",
            "Traductores": "Interpretación simultánea o traducción de contenidos escritos/audiovisuales para personas de habla hispana con limitaciones auditivas (lengua de señas) o hablantes de otros idiomas.",
            "Comunicaciones y Redes": "Diseño gráfico, fotografía, redacción y gestión de medios digitales/redes sociales para la difusión de las actividades e identidad de la iglesia.",
            "Medios e Infraestructura": "Mantenimiento físico, montaje de escenarios, soporte técnico de instalaciones y gestión de espacios de reunión para garantizar el correcto funcionamiento del espacio físico."
        };

        // BANCO DE OBSERVACIONES CUALITATIVAS AMPLIADO Y PROFUNDO
        const OBSERVACIONES = {
            "Destreza Social": {
                alto: "Sobresaliente: Posee alta carisma y soltura natural para iniciar conversaciones y construir relaciones de confianza rápidamente. Ideal para roles de vocería, recepción de personas e integración comunitaria.",
                medio: "Desarrollado: Demuestra buenas habilidades de comunicación interpersonal. Se desenvuelve bien en entornos conocidos y es capaz de colaborar eficazmente en equipos de trabajo establecidos.",
                bajo: "En desarrollo: Muestra preferencia por tareas individuales o grupos pequeños. Se beneficia de ambientes estructurados con roles claros antes de asumir interacción constante con el público."
            },
            "Sensibilidad Social": {
                alto: "Sobresaliente: Demuestra profunda empatía, compasión activa y discernimiento para percibir necesidades emocionales o espirituales. Excelente perfil para consolación, consejería y cuidado pastoral.",
                medio: "Desarrollado: Muestra un genuino interés por el bienestar de los demás manteniendo la objetividad. Capaz de brindar apoyo oportuno sin comprometer la efectividad operativa.",
                bajo: "En desarrollo: Enfoque altamente pragmático y orientado a tareas. Requiere directrices o listas de chequeo claras cuando debe gestionar aspectos de atención humana o pastoral."
            },
            "Adaptabilidad": {
                alto: "Sobresaliente: Excepcional capacidad de respuesta ante contingencias, cambios de planes o situaciones de alta presión. Mantiene la templanza y transmite calma al equipo.",
                medio: "Desarrollado: Maneja adecuadamente las modificaciones de rutina cuando se comunican con anticipación. Es flexible dentro de un margen razonable de previsibilidad.",
                bajo: "En desarrollo: Altamente estructurado. Se desempeña con mayor eficiencia y seguridad en procesos estables, estandarizados y con instrucciones bien definidas desde el inicio."
            },
            "Recursividad": {
                alto: "Sobresaliente: Mente creativa e innovadora. Encuentra soluciones pragmáticas y eficientes en escenarios complejos o con recursos limitados. Aporta valor en la resolución de problemas.",
                medio: "Desarrollado: Capaz de proponer alternativas útiles frente a imprevistos del día a día. Utiliza adecuadamente las herramientas disponibles para resolver bloqueos.",
                bajo: "En desarrollo: Prefiere aplicar procedimientos y métodos previamente aprobados. Requiere mentoría para desarrollar iniciativa propia en situaciones no contempladas."
            },
            "Persuasión": {
                alto: "Sobresaliente: Capacidad natural de liderazgo e influencia. Comunica visiones con pasión e inspira movilización activa en grupos de personas. Apto para dirección de proyectos.",
                medio: "Desarrollado: Expresa argumentos de forma clara y lógica. Impacta positivamente en su círculo inmediato y puede motivar a otros desde el ejemplo personal.",
                bajo: "En desarrollo: Estilo de trabajo centrado en la ejecución silenciosa o de apoyo. Prefiere que otros asuman la vocería o toma de decisiones públicas."
            },
            "Perseverancia": {
                alto: "Sobresaliente: Disciplina metódica y tenacidad notable. Cumple compromisos hasta el final, superando barreras u obstáculos a lo largo del tiempo sin perder la motivación.",
                medio: "Desarrollado: Demuestra constancia y responsabilidad con sus asignaciones habituales. Logra concluir proyectos de mediano alcance de forma confiable.",
                bajo: "En desarrollo: Tiende a perder el enfoque o dinamismo en proyectos de larga duración. Se beneficia de subdividir metas en entregables a corto plazo y seguimiento periódico."
            },
            "Tolerancia": {
                alto: "Sobresaliente: Excelente paciencia y madurez para gestionar desacuerdos o puntos de vista opuestos. Facilita la resolución pacífica de conflictos y promueve la unidad.",
                medio: "Desarrollado: Mantiene un trato respetuoso frente a la diversidad de criterios. Sabe negociar diferencias y colaborar en armonía en entornos diversos.",
                bajo: "En desarrollo: Firme en sus convicciones y expectativas. Rinde mejor en equipos donde existen acuerdos claros y límites de autoridad plenamente definidos."
            },
            "Vitalidad": {
                alto: "Sobresaliente: Nivel superior de energía física y entusiasmo contagioso. Excelente capacidad para jornadas dinámicas, activas o de ritmo intenso.",
                medio: "Desarrollado: Mantiene un ritmo operativo constante, equilibrado y sostenible en el tiempo. Administra bien su esfuerzo personal.",
                bajo: "En desarrollo: Desempeño óptimo en actividades de bajo desgaste físico, que requieran concentración, análisis o serenidad de ejecución."
            }
        };

        document.getElementById('btn-login').addEventListener('click', function() {
            const pin = document.getElementById('pin-input').value.trim();
            if (pin === ADMIN_PIN) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadRecords();
            } else {
                alert("PIN incorrecto.");
            }
        });

        document.getElementById('pin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('btn-login').click();
        });

        document.getElementById('btn-fetch').addEventListener('click', loadRecords);
        document.getElementById('btn-search').addEventListener('click', searchRecords);
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchRecords();
        });

        async function loadRecords() {
            const status = document.getElementById('status-msg');
            status.classList.remove('hidden');
            status.className = "text-xs text-slate-500 font-medium";
            status.innerText = "Conectando con Google Sheets...";

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                if (!response.ok) throw new Error("Error en la respuesta del servidor");
                
                dbRecords = await response.json();
                status.className = "text-xs text-emerald-600 font-medium";
                status.innerText = `Sincronización exitosa: ${dbRecords.length} registro(s) disponible(s).`;
            } catch (e) {
                status.className = "text-xs text-red-500 font-medium";
                status.innerText = "Error al conectar con Google Sheets. Verifique el despliegue.";
            }
        }

        function searchRecords() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsList = document.getElementById('results-list');
            const container = document.getElementById('results-container');
            resultsList.innerHTML = '';

            if (!query) {
                alert("Por favor ingrese un término de búsqueda.");
                return;
            }

            const matches = dbRecords.filter(r => {
                const nombres = (r.nombres || r.Nombres || '').toLowerCase();
                const apellidos = (r.apellidos || r.Apellidos || '').toLowerCase();
                const fullName = `${nombres} ${apellidos}`;
                const id = String(r.identificacion || r.Identificacion || '').toLowerCase();
                
                return fullName.includes(query) || id.includes(query);
            });

            if (matches.length === 0) {
                resultsList.innerHTML = '<p class="text-sm text-slate-500 py-4 text-center">No se encontraron evaluaciones registradas con ese criterio.</p>';
            } else {
                matches.forEach((r) => {
                    const idx = dbRecords.indexOf(r);
                    const nombres = r.nombres || r.Nombres || '';
                    const apellidos = r.apellidos || r.Apellidos || '';
                    const id = r.identificacion || r.Identificacion || 'N/A';
                    const edad = r.edad || r.Edad || 'N/A';
                    const correo = r.correo || r.Correo || 'N/A';
                    const top1 = r.top1 || r['Top 1 Area'] || 'N/A';

                    resultsList.innerHTML += `
                        <div class="p-4 border border-slate-200 rounded-xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h4 class="font-bold text-slate-900">${nombres} ${apellidos}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">ID: ${id} | Edad: ${edad} | Correo: ${correo}</p>
                                <p class="text-xs font-semibold text-emerald-700 mt-1">Sugerencia Principal: ${top1}</p>
                            </div>
                            <button onclick="generatePDFForRecord(${idx})" class="px-4 py-2 bg-black hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition whitespace-nowrap">
                                📄 Descargar PDF
                            </button>
                        </div>
                    `;
                });
            }
            container.classList.remove('hidden');
        }

        function generatePDFForRecord(index) {
            const record = dbRecords[index];
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            function cleanAreaName(rawName) {
                if (!rawName) return "";
                return rawName.replace(/\s*\(\d+\%\)/g, "").trim();
            }

            let perfil = {};
            try {
                const rawPerfil = record.perfil || record['Perfil Resumen'];
                perfil = typeof rawPerfil === 'string' ? JSON.parse(rawPerfil) : rawPerfil;
            } catch (e) {
                perfil = {};
            }

            const nombres = record.nombres || record.Nombres || '';
            const apellidos = record.apellidos || record.Apellidos || '';
            const id = record.identificacion || record.Identificacion || 'N/A';
            const edad = record.edad || record.Edad || 'N/A';
            const correo = record.correo || record.Correo || 'N/A';

            const rawTop1 = record.top1 || record['Top 1 Area'] || 'N/A';
            const rawTop2 = record.top2 || record['Top 2 Area'] || 'N/A';
            const rawTop3 = record.top3 || record['Top 3 Area'] || 'N/A';

            const cleanTop1 = cleanAreaName(rawTop1);
            const cleanTop2 = cleanAreaName(rawTop2);
            const cleanTop3 = cleanAreaName(rawTop3);

            // Encabezado Corporativo
            doc.setFillColor(0, 0, 0);
            doc.rect(0, 0, 210, 20, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(13);
            doc.setFont("helvetica", "bold");
            doc.text("IGLECO - PERFILAMIENTO PSICOMÉTRICO Y MINISTERIAL", 14, 13);

            // Datos Personales
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(11);
            doc.text("INFORMACIÓN DEL EVALUADO", 14, 28);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`Nombre Completo: ${nombres} ${apellidos}`, 14, 34);
            doc.text(`Identificación: ${id}`, 14, 40);
            doc.text(`Edad: ${edad} años`, 14, 46);
            doc.text(`Correo Electrónico: ${correo}`, 14, 52);

            // Áreas Sugeridas con Definiciones Técnicas Precisas
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("ÁREAS DE SERVICIO SUGERIDAS Y DEFINICIÓN TÉCNICA", 14, 62);

            const areasBody = [
                ['Área Principal (Top 1)', rawTop1, DEFINICIONES_AREAS[cleanTop1] || "Acompañamiento e integración en el servicio comunitario según perfil."],
                ['Área Secundaria (Top 2)', rawTop2, DEFINICIONES_AREAS[cleanTop2] || "Soporte colaborativo en procesos operativos y de acompañamiento."],
                ['Área Alternativa (Top 3)', rawTop3, DEFINICIONES_AREAS[cleanTop3] || "Opción complementaria para diversificar el servicio según las necesidades."]
            ];

            doc.autoTable({
                startY: 65,
                head: [['Prioridad', 'Área Recomendada', 'Propósito y Alcance del Área']],
                body: areasBody,
                theme: 'striped',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 38 }, 1: { cellWidth: 38 }, 2: { cellWidth: 104 } }
            });

            // Diagnóstico Cualitativo por Categoría
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("DIAGNÓSTICO CUALITATIVO POR CATEGORÍA", 14, doc.lastAutoTable.finalY + 10);

            const traitRows = Object.keys(perfil).map(trait => {
                const score = perfil[trait];
                let nivel = "medio";
                if (score >= 75) nivel = "alto";
                else if (score < 50) nivel = "bajo";

                const obsObj = OBSERVACIONES[trait] || {
                    alto: "Desempeño sobresaliente en la categoría.",
                    medio: "Desempeño adecuado y funcional.",
                    bajo: "Área con oportunidad de crecimiento."
                };

                return [trait, `${score}%`, obsObj[nivel]];
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 14,
                head: [['Rasgo Evaluado', 'Puntaje', 'Perfilamiento Cualitativo / Observación']],
                body: traitRows.length > 0 ? traitRows : [['N/A', 'N/A', 'Sin datos disponibles']],
                theme: 'grid',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 38 }, 1: { cellWidth: 20 }, 2: { cellWidth: 122 } }
            });

            doc.save(`Reporte_IGLECO_Cualitativo_${id}.pdf`);
        }
    </script>
</body>
</html>
