<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | IGLECO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF para Reportes PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        .card-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- ENCABEZADO CORPORATIVO IGLECO -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="text-2xl font-black tracking-widest text-black flex items-center">
                    IGLE<span class="font-extrabold text-slate-800">CO</span>
                </div>
                <div class="h-6 w-px bg-slate-300"></div>
                <span class="text-xs font-bold tracking-wider text-slate-500 uppercase">Panel Administrativo</span>
            </div>
            <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-mono border border-slate-200">Acceso Restringido</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto my-10 px-4">
        
        <!-- PANTALLA DE ACCESO POR PIN -->
        <div id="login-box" class="card-box p-8 max-w-md mx-auto text-center space-y-6">
            <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mx-auto text-xl">🔒</div>
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Acceso Requerido</h2>
                <p class="text-sm text-slate-500 mt-1">Ingrese el PIN de seguridad para acceder al panel.</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="pin-input" placeholder="••••" maxlength="8" onkeydown="if(event.key==='Enter') executeLogin()" class="w-full p-3 border border-slate-300 rounded-lg text-center text-2xl tracking-widest outline-none focus:ring-2 focus:ring-black">
                <button type="button" onclick="executeLogin()" class="w-full py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition shadow-sm cursor-pointer">
                    Ingresar al Panel
                </button>
            </div>
        </div>

        <!-- PANEL DE BÚSQUEDA Y REPORTES -->
        <div id="admin-panel" style="display: none;" class="space-y-6">
            <div class="card-box p-6 md:p-8 space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">Consulta de Evaluados</h2>
                        <p class="text-sm text-slate-500">Busque por identificación o nombres para visualizar en pantalla o descargar el informe en PDF.</p>
                    </div>
                    <button onclick="loadRecords()" type="button" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition flex items-center gap-1 cursor-pointer">
                        🔄 Sincronizar Datos
                    </button>
                </div>

                <!-- CAMPO DE BÚSQUEDA -->
                <div class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="search-input" onkeydown="if(event.key==='Enter') searchRecords()" placeholder="Ingrese Identificación (Cédula) o Nombres..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-black outline-none text-sm">
                    <button type="button" onclick="searchRecords()" class="px-6 py-3 bg-black hover:bg-slate-800 text-white font-semibold rounded-lg transition text-sm whitespace-nowrap cursor-pointer">
                        Buscar Registro
                    </button>
                </div>

                <div id="status-msg" style="display: none;" class="text-xs font-medium">Conectando...</div>

                <!-- RESULTADOS DE BÚSQUEDA -->
                <div id="results-container" style="display: none;" class="space-y-4 border-t border-slate-100 pt-4">
                    <h3 class="font-bold text-slate-900 text-xs uppercase tracking-wider text-slate-500">Resultados Encontrados</h3>
                    <div id="results-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL DE VISUALIZACIÓN EN PANTALLA -->
    <div id="preview-modal" style="display: none;" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 space-y-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-black text-2xl font-bold cursor-pointer">✕</button>
            <div id="modal-content" class="space-y-6"></div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3jCdQhXobfC7RMKPJIxgQXKzeXLyUMeuU8VOQQr25G_QRqaJ-pTCF3Cf0rb9S8PZObQ/exec";
        let dbRecords = [];

        function executeLogin() {
            const input = document.getElementById('pin-input');
            const pin = input ? input.value.trim() : '';
            if (pin === '1234') {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadRecords();
            } else {
                alert('PIN incorrecto. Ingrese 1234');
            }
        }

        // CATÁLOGO DE LOS 16 TIPOS DE PERSONALIDAD MBTI
        const TIPOS_PERSONALIDAD = {
            "ISTJ": { nombre: "Logístico", desc: "Pragmático, responsable, enfocado en el orden, la tradición y los procesos estructurados. Cumple sus deberes con alta fidelidad sin necesidad de supervisión constante." },
            "INFJ": { nombre: "Consejero", desc: "Visionario, empático y orientado a guiar a las personas en su crecimiento espiritual y personal. Posee un discernimiento profundo y una gran sensibilidad." },
            "INTJ": { nombre: "Arquitecto", desc: "Pensador estratégico, analítico y planificador de largo alcance. Diseña estructuras y sistemas eficientes para el desarrollo institucional." },
            "ISFJ": { nombre: "Defensor", desc: "Leal, altruista y dedicado al cuidado de los demás. Trabaja con diligencia constante tras bambalinas creando entornos acogedores." },
            "ISTP": { nombre: "Virtuoso", desc: "Práctico, observador y altamente recursivo en entornos operativos y técnicos. Resuelve contingencias con lógica e ingenio." },
            "ISFP": { nombre: "Aventurero", desc: "Sensible, artístico y guiado por la expresión estética e intuitiva. Aporta calidez y creatividad sin buscar protagonismo." },
            "INFP": { nombre: "Mediador", desc: "Idealista, compasivo y guiado por valores profundos. Excelente en el acompañamiento individual y en la restauración del alma." },
            "INTP": { nombre: "Lógico", desc: "Analítico, curioso y enfocado en la solidez conceptual y bíblica. Examina la enseñanza y la estructura organizativa con rigor." },
            "ESTP": { nombre: "Emprendedor", desc: "Dinámico, pragmático y orientado a la acción inmediata. Responde con agilidad en eventos masivos y contingencias en vivo." },
            "ESFP": { nombre: "Animador", desc: "Espontáneo, entusiasta y enérgico. Conecta inmediatamente con grupos e inyecta alegría y dinamismo en la comunidad." },
            "ENFP": { nombre: "Activista", desc: "Inspirador, creativo y motivador por naturaleza. Moviliza personas hacia causas comunitarias y evangelísticas con gran soltura." },
            "ENTP": { nombre: "Orador", desc: "Persuasivo, innovador y articulador de ideas. Le agrada debatir, proponer estrategias audaces y desafiar el statu quo." },
            "ESTJ": { nombre: "Ejecutivo", desc: "Organizador nato, estructurado y orientado a resultados medibles. Excelente en la logística, administración y coordinación de equipos." },
            "ESFJ": { nombre: "Cónsul", desc: "Atento, colaborativo y centrado en la armonía social. Se destaca en la recepción, la hospitalidad y la cohesión de la membresía." },
            "ENFJ": { nombre: "Donador", desc: "Líder inspirador, mentor compasivo y facilitador del potencial de otros. Guía equipos con empatía y firmeza espiritual." },
            "ENTJ": { nombre: "Comandante", desc: "Líder estratégico, decidido y con visión global. Asume la dirección con autoridad, fijando metas claras y movilizando recursos." }
        };

        const DEFINICIONES_AREAS = {
            "Acompañamiento": "Cuidado pastoral y soporte emocional primario a personas o familias en situaciones de vulnerabilidad o transición.",
            "Adoración": "Dirección y ejecución del ministerio de música e instrumentación en las reuniones para facilitar la conexión espiritual.",
            "Artístico": "Expresión creativa mediante artes escénicas, danza, teatro y composición visual para transmitir mensajes bíblicos.",
            "Producción": "Gestión técnica y operativa del soporte logístico de audio, iluminación y transmisión en vivo.",
            "Ayudas Administrativas": "Soporte organizativo en gestión de archivos, bases de datos y logística de suministros.",
            "Ayudas Profesionales": "Orientación especializada en áreas técnicas (derecho, contabilidad, psicología) según necesidades.",
            "Conexión": "Acogida y primer contacto con visitantes para su integración fluida a los grupos de la iglesia.",
            "Contact Center": "Atención remota telefónica o virtual para responder inquietudes y registrar solicitudes.",
            "Decoración": "Ambientación y diseño espacial de los diferentes entornos del templo o eventos especiales.",
            "Discipulado": "Formación, mentoría y guía en el crecimiento espiritual mediante el estudio bíblico grupal.",
            "CFV - Kids": "Formación espiritual y pedagógica dirigida a la infancia temprana y escolar.",
            "Evangelismo": "Proyección hacia la comunidad externa mediante brigadas y actividades de alcance social.",
            "Hospitalidad": "Atención a invitados especiales y preparación de espacios de convivencia y alimentos.",
            "Maquillaje": "Caracterización y arreglo estético del personal de producción visual y cámaras.",
            "Monitores Escuelas": "Apoyo logístico, control de asistencia y dinamización en las aulas durante talleres.",
            "Oración": "Cobertura de intercesión continua por las peticiones de la comunidad y necesidades pastorales.",
            "PowerKids": "Actividades de alto impacto y animación dinámicas enfocadas en preadolescentes y niños.",
            "Seguridad": "Prevención, control de accesos y resguardo de la integridad física en las instalaciones.",
            "Servidores": "Logística interna y protocolo durante los servicios: acomodación y guía al asistente.",
            "Traductores": "Interpretación simultánea en lengua de señas u otros idiomas durante las reuniones.",
            "Comunicaciones y Redes": "Diseño gráfico, fotografía y gestión de medios digitales/redes sociales.",
            "Medios e Infraestructura": "Mantenimiento físico, montaje de escenarios y gestión de espacios de reunión."
        };

        async function loadRecords() {
            const status = document.getElementById('status-msg');
            status.style.display = "block";
            status.className = "text-xs text-slate-500 font-medium";
            status.innerText = "Conectando con Google Sheets...";

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                if (!response.ok) throw new Error("Error en la respuesta del servidor");
                
                const data = await response.json();
                dbRecords = Array.isArray(data) ? data : (data.records || []);
                
                status.className = "text-xs text-emerald-600 font-medium";
                status.innerText = `Sincronización exitosa: ${dbRecords.length} registro(s) disponible(s).`;
            } catch (e) {
                status.className = "text-xs text-red-500 font-medium";
                status.innerText = "Error al conectar con Google Sheets.";
            }
        }

        function searchRecords() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsList = document.getElementById('results-list');
            const container = document.getElementById('results-container');
            resultsList.innerHTML = '';

            if (!query) {
                alert("Por favor ingrese un término de búsqueda.");
                return;
            }

            const matches = dbRecords.filter(r => {
                const nombres = (r.nombres || r.Nombres || '').toLowerCase();
                const apellidos = (r.apellidos || r.Apellidos || '').toLowerCase();
                const fullName = `${nombres} ${apellidos}`;
                const id = String(r.identificacion || r.Identificacion || '').toLowerCase();
                
                return fullName.includes(query) || id.includes(query);
            });

            if (matches.length === 0) {
                resultsList.innerHTML = '<p class="text-sm text-slate-500 py-4 text-center">No se encontraron evaluaciones registradas con ese criterio.</p>';
            } else {
                matches.forEach((r) => {
                    const idx = dbRecords.indexOf(r);
                    const nombres = r.nombres || r.Nombres || '';
                    const apellidos = r.apellidos || r.Apellidos || '';
                    const id = r.identificacion || r.Identificacion || 'N/A';
                    const edad = r.edad || r.Edad || 'N/A';
                    const correo = r.correo || r.Correo || 'N/A';
                    const top1 = r.top1 || r['Top 1 Area'] || 'N/A';

                    resultsList.innerHTML += `
                        <div class="p-4 border border-slate-200 rounded-xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h4 class="font-bold text-slate-900">${nombres} ${apellidos}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">ID: ${id} | Edad: ${edad} | Correo: ${correo}</p>
                                <p class="text-xs font-semibold text-emerald-700 mt-1">Sugerencia Principal: ${top1}</p>
                            </div>
                            <div class="flex gap-2 w-full md:w-auto">
                                <button onclick="viewInScreen(${idx})" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold rounded-lg border border-slate-300 transition cursor-pointer">
                                    👁️ Ver en Pantalla
                                </button>
                                <button onclick="generatePDFForRecord(${idx})" class="flex-1 md:flex-none px-4 py-2 bg-black hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition cursor-pointer">
                                    📄 Descargar PDF
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
            container.style.display = "block";
        }

        // ALGORITMO DE DEDUCCIÓN DE PERSONALIDAD 16 TIPOS (MBTI)
        function derivePersonalityType(perfil) {
            const des = perfil["Destreza Social"] || 50;
            const perS = perfil["Persuasión"] || 50;
            const E = (des + perS) / 2 >= 55 ? 'E' : 'I';

            const rec = perfil["Recursividad"] || 50;
            const vit = perfil["Vitalidad"] || 50;
            const N = (rec + vit) / 2 >= 55 ? 'N' : 'S';

            const sen = perfil["Sensibilidad Social"] || 50;
            const tol = perfil["Tolerancia"] || 50;
            const F = (sen + tol) / 2 >= 55 ? 'F' : 'T';

            const per = perfil["Perseverancia"] || 50;
            const ada = perfil["Adaptabilidad"] || 50;
            const J = per >= ada ? 'J' : 'P';

            const code = `${E}${N}${F}${J}`;
            const info = TIPOS_PERSONALIDAD[code] || { nombre: "Perfil Equilibrado", desc: "Demuestra una combinación versátil de rasgos analíticos y sociales." };

            return { code, nombre: info.nombre, desc: info.desc };
        }

        // DEDUCCIÓN DE ORIENTACIÓN PRÁCTICA AL SERVICIO EN LA IGLESIA
        function deriveServiceOrientation(perfil) {
            const des = perfil["Destreza Social"] || 50;
            const sen = perfil["Sensibilidad Social"] || 50;
            const perS = perfil["Persuasión"] || 50;
            const per = perfil["Perseverancia"] || 50;
            const rec = perfil["Recursividad"] || 50;

            let orientacion = "";
            let detalles = "";

            if ((des + sen) / 2 >= 65) {
                orientacion = "Orientación de Servicio Directo a Personas (Cuidado y Recepción)";
                detalles = "Perfil ideal para estar en contacto permanente con los asistentes, brindando acogida, consuelo, apoyo emocional y acompañamiento en grupos.";
            } else if (per >= 65 && des < 55) {
                orientacion = "Orientación a Labores Administrativas y Metodológicas (Estructura Interna)";
                detalles = "Excelente para el soporte en el orden operativo tras bambalinas, sistematización de datos, archivo, control logístico e inventarios.";
            } else if (rec >= 65) {
                orientacion = "Orientación Creativa, Técnica y de Producción (Soporte Operativo)";
                detalles = "Destaca en entornos dinámicos que demandan solución práctica de problemas, montaje, arte, medios de comunicación o infraestructura física.";
            } else if (perS >= 65) {
                orientacion = "Orientación de Liderazgo, Vocería y Movilización (Dirección de Equipos)";
                detalles = "Facilidad para guiar proyectos, capacitar voluntarios, liderar comités o motivar hacia metas grupales con comunicación persuasiva.";
            } else {
                orientacion = "Perfil Operativo Polivalente / Soporte Silencioso de Bajo Perfil";
                detalles = "Prefiere ejecutar instrucciones claras dentro de rutinas estables sin requerir alta exposición pública, actuando como un pilar confiable de apoyo.";
            }

            return { orientacion, detalles };
        }

        // NARRATIVA CUALITATIVA GENERAL POR EJES
        function generateAxisNarrative(perfil) {
            const rec = perfil["Recursividad"] || 50;
            const per = perfil["Perseverancia"] || 50;
            const vit = perfil["Vitalidad"] || 50;
            const avgProd = (rec + per + vit) / 3;

            let prodDesc = "";
            if (avgProd >= 70) {
                prodDesc = "En cuanto a la Ejecución de Tareas y Productividad, el evaluado refleja un dinamismo operativo sobresaliente, caracterizado por una marcada agilidad para resolver imprevistos y sostener la disciplina en entregables exigentes.";
            } else if (avgProd >= 50) {
                prodDesc = "En el ámbito de la Ejecución de Tareas y Productividad, demuestra un desempeño constante, metódico y funcional dentro de procesos bien estructurados y rutinas estables.";
            } else {
                prodDesc = "Respecto a la Ejecución de Tareas y Productividad, muestra inclinación hacia tareas de ritmo pausado y secuencial que requieren acompañamiento paso a paso e instrucciones claras.";
            }

            const ada = perfil["Adaptabilidad"] || 50;
            const tol = perfil["Tolerancia"] || 50;
            const avgEmo = (ada + tol) / 2;

            let emoDesc = "";
            if (avgEmo >= 70) {
                emoDesc = "En la dimensión del Manejo Emocional, evidencia alta madurez, templanza y autocontrol ante escenarios de presión o imprevistos, actuando como un agente de serenidad en el grupo.";
            } else if (avgEmo >= 50) {
                emoDesc = "En cuanto al Manejo Emocional, conserva una estabilidad adecuada frente a contingencias habituales, requiriendo un margen normal de adaptación ante cambios organizacionales.";
            } else {
                emoDesc = "En el área del Manejo Emocional, refleja un alto apego a la norma y a las reglas establecidas, pudiendo experimentar incomprensión ante la improvisación o alteraciones imprevistas.";
            }

            const des = perfil["Destreza Social"] || 50;
            const sen = perfil["Sensibilidad Social"] || 50;
            const perS = perfil["Persuasión"] || 50;
            const avgRel = (des + sen + perS) / 3;

            let relDesc = "";
            if (avgRel >= 70) {
                relDesc = "En lo referente a las Relaciones Interpersonales, se distingue por su empatía activa, soltura comunicativa y capacidad natural para conectar de forma cercana con diversos tipos de personas.";
            } else if (avgRel >= 50) {
                relDesc = "En la esfera de las Relaciones Interpersonales, interactúa con educación, respeto y buen trato, adaptándose favorablemente al trabajo colaborativo en equipos formales.";
            } else {
                relDesc = "En lo relativo a Relaciones Interpersonales, mantiene un estilo cauto y reservado, priorizando círculos de confianza reducidos y enfocado en la tarea por encima de la socialización.";
            }

            return { prodDesc, emoDesc, relDesc };
        }

        // ANÁLISIS GENERAL DE FORTALEZAS Y OPORTUNIDADES
        function generateGeneralSWOT(perfil) {
            const sorted = Object.keys(perfil).sort((a, b) => perfil[b] - perfil[a]);
            const topTraits = sorted.slice(0, 3);
            const lowTraits = sorted.slice(-2);

            const fortalezas = `Demuestra una marcada solvencia en ${topTraits.join(', ')}, lo que le permite aportar valor inmediato en la resolución de problemas, el compromiso con el deber y la colaboración comunitaria.`;
            const oportunidades = `Sus principales áreas de crecimiento radican en fortalecer ${lowTraits.join(' y ')}, gestionando la autorregulación para mantener el equilibrio entre el rendimiento y la flexibilidad.`;

            return { fortalezas, oportunidades };
        }

        // MOSTRAR RESULTADOS EN PANTALLA (MODAL)
        function viewInScreen(index) {
            const record = dbRecords[index];
            let perfil = {};
            try {
                const rawPerfil = record.perfil || record['Perfil Resumen'];
                perfil = typeof rawPerfil === 'string' ? JSON.parse(rawPerfil) : rawPerfil;
            } catch (e) { perfil = {}; }

            const nombres = record.nombres || record.Nombres || '';
            const apellidos = record.apellidos || record.Apellidos || '';
            const id = record.identificacion || record.Identificacion || 'N/A';
            const edad = record.edad || record.Edad || 'N/A';
            const correo = record.correo || record.Correo || 'N/A';

            const rawTop1 = record.top1 || record['Top 1 Area'] || 'N/A';
            const rawTop2 = record.top2 || record['Top 2 Area'] || 'N/A';
            const rawTop3 = record.top3 || record['Top 3 Area'] || 'N/A';

            const pType = derivePersonalityType(perfil);
            const sOrient = deriveServiceOrientation(perfil);
            const axisNav = generateAxisNarrative(perfil);
            const swot = generateGeneralSWOT(perfil);

            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="border-b border-slate-200 pb-4">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Informe Cualitativo de Evaluación</span>
                    <h2 class="text-2xl font-black text-slate-900">${nombres} ${apellidos}</h2>
                    <p class="text-xs text-slate-500 mt-1">ID: ${id} | Edad: ${edad} años | Correo: ${correo}</p>
                </div>

                <!-- TIPO DE PERSONALIDAD -->
                <div class="bg-slate-900 text-white p-5 rounded-xl space-y-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Arquetipo de Personalidad Sugerido</span>
                    <h3 class="text-xl font-bold">${pType.code} - ${pType.nombre}</h3>
                    <p class="text-xs text-slate-300 leading-relaxed">${pType.desc}</p>
                </div>

                <!-- ÁREAS RECOMENDADAS -->
                <div class="space-y-3">
                    <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700">Áreas de Servicio Sugeridas</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <div class="p-3 border border-slate-200 rounded-lg bg-emerald-50/50">
                            <span class="font-bold text-emerald-800">1. ${rawTop1}</span>
                        </div>
                        <div class="p-3 border border-slate-200 rounded-lg bg-slate-50">
                            <span class="font-bold text-slate-700">2. ${rawTop2}</span>
                        </div>
                        <div class="p-3 border border-slate-200 rounded-lg bg-slate-50">
                            <span class="font-bold text-slate-700">3. ${rawTop3}</span>
                        </div>
                    </div>
                </div>

                <!-- ORIENTACIÓN DE SERVICIO PRÁCTICO -->
                <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 space-y-2 text-xs">
                    <h3 class="font-bold text-blue-900 uppercase tracking-wider">Orientación de Servicio Práctico en la Iglesia</h3>
                    <p class="font-bold text-slate-800">${sOrient.orientacion}</p>
                    <p class="text-slate-600 leading-relaxed">${sOrient.detalles}</p>
                </div>

                <!-- NARRATIVA POR EJES CONDUCTUALES -->
                <div class="space-y-3 text-xs">
                    <h3 class="font-bold uppercase tracking-wider text-slate-700">Descripción Cualitativa por Ejes Conductuales</h3>
                    <div class="p-4 border border-slate-200 rounded-xl space-y-2 bg-slate-50">
                        <p>• <strong>Ejecución y Productividad:</strong> ${axisNav.prodDesc}</p>
                        <p>• <strong>Manejo Emocional:</strong> ${axisNav.emoDesc}</p>
                        <p>• <strong>Relaciones Interpersonales:</strong> ${axisNav.relDesc}</p>
                    </div>
                </div>

                <!-- FORTALEZAS Y OPORTUNIDADES GLOBALES -->
                <div class="space-y-3 text-xs">
                    <h3 class="font-bold uppercase tracking-wider text-slate-700">Análisis General de Fortalezas y Oportunidades</h3>
                    <div class="p-4 border border-slate-200 rounded-xl space-y-2 bg-white">
                        <p>• <strong>Fortalezas Generales:</strong> ${swot.fortalezas}</p>
                        <p>• <strong>Oportunidades de Crecimiento:</strong> ${swot.oportunidades}</p>
                    </div>
                </div>
            `;

            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        // GENERACIÓN DEL PDF ESTRUCTURADO Y COMPLETO
        function generatePDFForRecord(index) {
            const record = dbRecords[index];
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            function cleanAreaName(rawName) {
                if (!rawName) return "";
                return rawName.replace(/\s*\(\d+%\)/g, "").trim();
            }

            let perfil = {};
            try {
                const rawPerfil = record.perfil || record['Perfil Resumen'];
                perfil = typeof rawPerfil === 'string' ? JSON.parse(rawPerfil) : rawPerfil;
            } catch (e) { perfil = {}; }

            const nombres = record.nombres || record.Nombres || '';
            const apellidos = record.apellidos || record.Apellidos || '';
            const id = record.identificacion || record.Identificacion || 'N/A';
            const edad = record.edad || record.Edad || 'N/A';
            const correo = record.correo || record.Correo || 'N/A';

            const rawTop1 = record.top1 || record['Top 1 Area'] || 'N/A';
            const rawTop2 = record.top2 || record['Top 2 Area'] || 'N/A';
            const rawTop3 = record.top3 || record['Top 3 Area'] || 'N/A';

            const cleanTop1 = cleanAreaName(rawTop1);
            const cleanTop2 = cleanAreaName(rawTop2);
            const cleanTop3 = cleanAreaName(rawTop3);

            const pType = derivePersonalityType(perfil);
            const sOrient = deriveServiceOrientation(perfil);
            const axisNav = generateAxisNarrative(perfil);
            const swot = generateGeneralSWOT(perfil);

            // ENCABEZADO
            doc.setFillColor(0, 0, 0);
            doc.rect(0, 0, 210, 20, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(13);
            doc.setFont("helvetica", "bold");
            doc.text("IGLECO - PERFILAMIENTO PSICOMÉTRICO Y MINISTERIAL", 14, 13);

            // DATOS PERSONALES
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(11);
            doc.text("INFORMACIÓN DEL EVALUADO", 14, 28);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`Nombre Completo: ${nombres} ${apellidos}`, 14, 34);
            doc.text(`Identificación: ${id}`, 14, 40);
            doc.text(`Edad: ${edad} años`, 14, 46);
            doc.text(`Correo Electrónico: ${correo}`, 14, 52);

            // ARQUETIPO DE PERSONALIDAD (16 TIPOS)
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("PERFILAMIENTO DE PERSONALIDAD (SISTEMA DE 16 TIPOS)", 14, 62);

            doc.autoTable({
                startY: 65,
                head: [['Arquetipo Deduce', 'Descripción del Perfil de Personalidad']],
                body: [[ `${pType.code} - ${pType.nombre}`, pType.desc ]],
                theme: 'striped',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 50 }, 1: { cellWidth: 130 } }
            });

            // ÁREAS RECOMENDADAS
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("ÁREAS DE SERVICIO SUGERIDAS Y PROPÓSITO", 14, doc.lastAutoTable.finalY + 10);

            const areasBody = [
                ['Área Principal (Top 1)', rawTop1, DEFINICIONES_AREAS[cleanTop1] || "Acompañamiento e integración comunitaria."],
                ['Área Secundaria (Top 2)', rawTop2, DEFINICIONES_AREAS[cleanTop2] || "Soporte colaborativo en procesos operativos."],
                ['Área Alternativa (Top 3)', rawTop3, DEFINICIONES_AREAS[cleanTop3] || "Opción complementaria de servicio."]
            ];

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 14,
                head: [['Prioridad', 'Área Recomendada', 'Propósito']],
                body: areasBody,
                theme: 'striped',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 46 }, 1: { cellWidth: 44 }, 2: { cellWidth: 90 } }
            });

            // ORIENTACIÓN PRÁCTICA AL SERVICIO
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("ORIENTACIÓN PRÁCTICA AL SERVICIO MINISTERIAL", 14, doc.lastAutoTable.finalY + 10);

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 14,
                head: [['Perfil Funcional de Servicio', 'Perspectiva y Aplicación Práctica en la Iglesia']],
                body: [[ sOrient.orientacion, sOrient.detalles ]],
                theme: 'grid',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 60 }, 1: { cellWidth: 120 } }
            });

            // DESCRIPCIÓN CUALITATIVA POR EJES
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("OBSERVACIONES CUALITATIVAS POR EJES CONDUCTUALES", 14, doc.lastAutoTable.finalY + 10);

            const axisRows = [
                [ 'Ejecución y Productividad', axisNav.prodDesc ],
                [ 'Manejo Emocional', axisNav.emoDesc ],
                [ 'Relaciones Interpersonales', axisNav.relDesc ]
            ];

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 14,
                head: [['Eje Evaluado', 'Observación Cualitativa General']],
                body: axisRows,
                theme: 'striped',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 50 }, 1: { cellWidth: 130 } }
            });

            // ANÁLISIS GENERAL DE FORTALEZAS Y OPORTUNIDADES
            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.text("ANÁLISIS GENERAL DE FORTALEZAS Y OPORTUNIDADES", 14, doc.lastAutoTable.finalY + 10);

            const swotRows = [
                [ 'Fortalezas Generales', swot.fortalezas ],
                [ 'Oportunidades de Crecimiento', swot.oportunidades ]
            ];

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 14,
                head: [['Categoría', 'Análisis Cualitativo Global']],
                body: swotRows,
                theme: 'grid',
                headStyles: { fillColor: [0, 0, 0] },
                columnStyles: { 0: { cellWidth: 50 }, 1: { cellWidth: 130 } }
            });

            doc.save(`Reporte_IGLECO_${id}.pdf`);
        }
    </script>
</body>
</html>
